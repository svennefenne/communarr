<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="style.css" />
    <title></title>
  </head>
  <body class="picker">
    <header><h1 data-t="Share your screen"></h1></header>
    <main>
      <h2 data-t="Screens"></h2>
      <div class="grid" id="screens"></div>
      <h2 data-t="Windows"></h2>
      <div class="grid" id="windows"></div>
      <p class="empty" id="none" data-t="No windows to share." hidden></p>
    </main>
    <footer>
      <div class="grow" id="sound" hidden>
        <label class="check"><input type="checkbox" id="audio" checked /> <span data-t="Include the computer's sound"></span></label>
        <p class="hint" data-t="All the computer's sound goes along, the call's voices too: use headphones, or others in the call hear themselves."></p>
      </div>
      <div class="row">
        <button class="ghost" id="cancel" type="button" data-t="Cancel"></button>
        <button class="primary" id="share" type="button" data-t="Share" disabled></button>
      </div>
    </footer>
    <script src="common.js"></script>
    <script src="picker.js"></script>
  </body>
</html>
