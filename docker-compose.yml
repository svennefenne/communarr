# Hooden on a home server (made for an Intel NUC; any amd64 Linux box with Docker works).
#
#   cp .env.example .env      # then edit .env
#   docker compose up -d                      # just Hooden, on http://<server>:3000
#   docker compose --profile https up -d      # + Caddy: automatic HTTPS for your domain
#   docker compose --profile tunnel up -d     # + Cloudflare Tunnel: HTTPS without opening ports
#   docker compose --profile turn up -d       # + coturn: voice chat for phones on mobile data
#
# Profiles can be combined (--profile https --profile turn), or set once in .env with
# COMPOSE_PROFILES=https,turn so a plain `docker compose up -d` uses them. Phones need HTTPS for push
# notifications and voice chat, so use one of the two HTTPS profiles (or your own reverse proxy).

services:
  hooden:
    image: ghcr.io/svennefenne/hooden:latest
    # build: .            # or build it here instead of pulling it
    container_name: hooden
    restart: unless-stopped
    ports:
      - "${HOODEN_PORT:-3000}:3000"
    environment:
      TZ: ${TZ:-Europe/Stockholm}
      # who owns the files in ./data (1000:1000 is the first user on most Linux machines)
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      # the address people use, e.g. https://hooden.example.com (invite links, calendar feeds)
      PUBLIC_URL: ${PUBLIC_URL:-}
      # behind a Cloudflare Tunnel: cf-connecting-ip (slows down password guessing per visitor)
      TRUSTED_IP_HEADER: ${TRUSTED_IP_HEADER:-}
      # voice chat through the TURN server below (or one of your own)
      VOICE_TURN_URL: ${VOICE_TURN_URL:-}
      VOICE_TURN_USER: ${VOICE_TURN_USER:-}
      VOICE_TURN_PASS: ${VOICE_TURN_PASS:-}
    volumes:
      # the database, pictures and backups: back this folder up
      - ${HOODEN_DATA:-./data}:/data

  # ── HTTPS with Caddy: point your domain's DNS at your home IP and forward ports 80 and 443 ──
  caddy:
    profiles: ["https"]
    image: caddy:2
    container_name: hooden-caddy
    restart: unless-stopped
    depends_on: [hooden]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      HOODEN_DOMAIN: ${HOODEN_DOMAIN:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  # ── HTTPS with a Cloudflare Tunnel: no open ports. Make a tunnel in the Cloudflare dashboard
  #    (Zero Trust → Networks → Tunnels), add a public hostname pointing to http://hooden:3000,
  #    and put its token in .env ──
  cloudflared:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    container_name: hooden-tunnel
    restart: unless-stopped
    depends_on: [hooden]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}

  # ── TURN for voice chat: relays calls that can't go straight between people (phones on mobile
  #    data, strict routers). Forward UDP/TCP 3478 and UDP 49160-49200 to the server, and set the
  #    VOICE_TURN_* values in .env (VOICE_TURN_URL=turn:<your domain or IP>:3478) ──
  coturn:
    profiles: ["turn"]
    image: coturn/coturn:4.6
    container_name: hooden-turn
    restart: unless-stopped
    network_mode: host
    environment:
      # your public IP; empty = look it up when coturn starts (restart it if your IP changes)
      REAL_EXTERNAL_IP: ${VOICE_TURN_PUBLIC_IP:-}
    command:
      - -n
      - --log-file=stdout
      - --listening-port=3478
      # behind a home router: relay on the server's LAN address and tell callers the public one
      - --relay-ip=${VOICE_TURN_LAN_IP:-}
      - --external-ip=$$(detect-external-ip)/${VOICE_TURN_LAN_IP:-}
      - --fingerprint
      - --lt-cred-mech
      - --realm=hooden
      - --user=${VOICE_TURN_USER:-hooden}:${VOICE_TURN_PASS:-change-me}
      - --min-port=49160
      - --max-port=49200
      # voice only needs UDP relays
      - --no-tcp-relay
      - --no-multicast-peers
      - --no-cli
      - --no-tlsv1
      - --no-tlsv1_1

volumes:
  caddy-data:
  caddy-config:
